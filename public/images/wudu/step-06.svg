<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Forearm & Hand from fingertips past the Elbow -->
  <!-- Arm extended horizontally / slightly angled -->
  <!-- Hand & Fingertips -->
  <path d="M420 185 C435 185 450 195 445 205 C440 215 425 215 410 215 L320 220 L230 225 C205 227 180 215 175 195 C170 175 190 160 215 165 L320 170 L410 175" fill="#F1EEE6" stroke="#174D3B" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Elbow Highlight (يشمل المرفق وجوباً) -->
  <circle cx="190" cy="195" r="32" stroke="#B99A5B" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <text x="190" y="245" fill="#B99A5B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">المرفق (مع الغسل)</text>

  <!-- Opposite hand rubbing water from fingertips up to and past the elbow -->
  <path d="M330 145 C350 145 365 160 360 180 C355 195 340 200 320 195 C305 190 300 170 310 155 Z" fill="#FFFFFF" stroke="#26745A" stroke-width="3.5"/>

  <!-- Direction arrow from fingertips towards elbow -->
  <path d="M400 140 L260 140" stroke="#26745A" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="260,135 250,140 260,145" fill="#26745A"/>

  <!-- Water flowing along the forearm and dripping from elbow -->
  <path d="M380 180 Q300 195 200 185" stroke="#26745A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="180" cy="210" r="4.5" fill="#26745A"/>
  <circle cx="170" cy="225" r="3.5" fill="#26745A"/>

  <!-- Obligatory Marker Badge -->
  <rect x="70" y="60" width="85" height="32" rx="16" fill="#174D3B"/>
  <text x="112" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">فرض / ركن</text>

  <!-- Step Count Badge (٣ مرات) -->
  <rect x="420" y="60" width="75" height="32" rx="16" fill="#B99A5B"/>
  <text x="457" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">٣ مرات</text>

  <!-- Step Banner Badge -->
  <g transform="translate(180, 360)">
    <rect width="240" height="38" rx="19" fill="#174D3B"/>
    <text x="120" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ٦: غسل اليدين إلى المرفقين</text>
  </g>
</svg>
