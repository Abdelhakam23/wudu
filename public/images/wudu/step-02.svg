<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="210" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Water Stream from above -->
  <path d="M300 70 L300 130" stroke="#26745A" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <path d="M292 85 L292 125 M308 85 L308 125" stroke="#26745A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Hands Washing & Intertwining (تخليل الأصابع وغسل الكفين) -->
  <!-- Left Hand -->
  <path d="M210 260 L245 200 C250 190 260 190 265 200 L275 220 L285 190 C290 180 300 180 303 190 L308 225 L315 195 C320 185 330 185 333 195 L330 235 L340 210 C344 200 354 202 355 212 L345 255 C335 285 310 295 280 295 L220 290 Z" fill="#F1EEE6" stroke="#174D3B" stroke-width="4" stroke-linejoin="round"/>

  <!-- Right Hand overlay rubbing the palms -->
  <path d="M390 260 L355 200 C350 190 340 190 335 200 L325 220 L315 190 C310 180 300 180 297 190 L292 225 L285 195 C280 185 270 185 267 195 L270 235" fill="none" stroke="#26745A" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Water Splashes and Droplets around hands -->
  <circle cx="250" cy="180" r="4.5" fill="#26745A"/>
  <circle cx="350" cy="180" r="4.5" fill="#26745A"/>
  <circle cx="220" cy="230" r="3.5" fill="#26745A" opacity="0.8"/>
  <circle cx="380" cy="230" r="3.5" fill="#26745A" opacity="0.8"/>
  <path d="M275 300 C275 300 285 315 285 322 C285 327 281 330 277 330 C273 330 269 327 269 322 C269 315 275 300 275 300 Z" fill="#26745A"/>
  <path d="M325 300 C325 300 335 315 335 322 C335 327 331 330 327 330 C323 330 319 327 319 322 C319 315 325 300 325 300 Z" fill="#26745A"/>

  <!-- Step Count Badge (٣ مرات) -->
  <rect x="420" y="60" width="75" height="32" rx="16" fill="#B99A5B"/>
  <text x="457" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">٣ مرات</text>

  <!-- Step Banner Badge -->
  <g transform="translate(210, 360)">
    <rect width="180" height="38" rx="19" fill="#174D3B"/>
    <text x="90" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ٢: غسل الكفين ثلاثاً</text>
  </g>
</svg>
