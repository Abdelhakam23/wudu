<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Leg & Foot Diagram extending down to sole, heel, and toes -->
  <!-- Lower leg & Ankle (الكعب) -->
  <path d="M250 120 L250 200 C250 220 235 240 220 255 C200 275 220 295 240 295 L340 295 C370 295 385 280 380 265 C375 250 355 240 330 235 C310 230 295 210 295 190 L295 120" stroke="#174D3B" stroke-width="4.5" stroke-linejoin="round" fill="#F1EEE6"/>

  <!-- Ankle Bone Highlight (الكعبان بارزان مع الغسل وجوباً) -->
  <circle cx="270" cy="235" r="22" stroke="#B99A5B" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <text x="345" y="215" fill="#B99A5B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">الكعب (يجب غسله)</text>
  <path d="M305 215 L285 230" stroke="#B99A5B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left hand washing with water, intertwining between toes (تخليل الأصابع بخنصر اليد اليسرى) -->
  <path d="M390 280 C395 265 410 255 425 265 C435 275 420 300 405 305 L375 300" stroke="#26745A" stroke-width="3.5" stroke-linecap="round" fill="#FFFFFF"/>
  <text x="430" y="325" fill="#26745A" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">تخليل أصابع القدم</text>

  <!-- Water flowing over the foot and heel (ويل للأعقاب من النار) -->
  <path d="M260 180 Q270 230 330 260" stroke="#26745A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="215" cy="285" r="4.5" fill="#26745A"/>
  <circle cx="230" cy="305" r="4" fill="#26745A"/>
  <circle cx="320" cy="305" r="4" fill="#26745A"/>

  <!-- Obligatory Marker Badge -->
  <rect x="70" y="60" width="85" height="32" rx="16" fill="#174D3B"/>
  <text x="112" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">فرض / ركن</text>

  <!-- Step Count Badge (٣ مرات) -->
  <rect x="420" y="60" width="75" height="32" rx="16" fill="#B99A5B"/>
  <text x="457" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">٣ مرات</text>

  <!-- Step Banner Badge -->
  <g transform="translate(185, 360)">
    <rect width="230" height="38" rx="19" fill="#174D3B"/>
    <text x="115" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ٩: غسل الرجلين إلى الكعبين</text>
  </g>
</svg>
