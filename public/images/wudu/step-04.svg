<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="210" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Profile face focus on nose & gentle inhalation/exhalation of water -->
  <path d="M260 120 C285 120 315 135 325 160 C332 175 348 190 350 202 C342 208 332 208 328 218 C324 230 326 242 318 255 C305 270 280 275 260 270" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Water vapor/droplets towards nose (الاستنشاق باليمين والاستنثار بالشمال) -->
  <path d="M365 210 Q352 202 345 204" stroke="#26745A" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="345,200 342,207 350,206" fill="#26745A"/>

  <!-- Hand positioning -->
  <path d="M390 260 C370 240 350 220 335 210 C320 205 315 215 325 225 C340 235 360 260 380 280" fill="#F1EEE6" stroke="#174D3B" stroke-width="4" stroke-linejoin="round"/>

  <!-- Water drops -->
  <circle cx="340" cy="195" r="4.5" fill="#26745A"/>
  <circle cx="355" cy="188" r="3.5" fill="#26745A" opacity="0.8"/>
  <circle cx="365" cy="225" r="3" fill="#26745A" opacity="0.6"/>

  <!-- Step Count Badge (٣ مرات) -->
  <rect x="420" y="60" width="75" height="32" rx="16" fill="#B99A5B"/>
  <text x="457" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">٣ مرات</text>

  <!-- Step Banner Badge -->
  <g transform="translate(190, 360)">
    <rect width="220" height="38" rx="19" fill="#174D3B"/>
    <text x="110" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ٤: الاستنشاق والاستنثار</text>
  </g>
</svg>
