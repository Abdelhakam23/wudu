<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="200" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Hands raised in supplication / Index finger raised pointing to sky (Tawhid) -->
  <!-- Index finger pointing skyward -->
  <path d="M285 240 L285 150 C285 140 295 135 305 135 C315 135 320 140 320 150 L320 200 L335 190 C345 185 355 190 355 200 C355 210 345 220 335 225 L345 215 C355 210 365 215 365 225 C365 235 355 245 345 250 L315 285 L280 285 Z" fill="#F1EEE6" stroke="#174D3B" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Golden Ray radiating from the top -->
  <path d="M302 70 L302 110" stroke="#B99A5B" stroke-width="3" stroke-linecap="round"/>
  <path d="M270 85 L285 115" stroke="#B99A5B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M335 85 L320 115" stroke="#B99A5B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Beautiful calligraphy Dhikr banner in traditional style -->
  <rect x="120" y="275" width="360" height="46" rx="23" fill="#FFFFFF" stroke="#B99A5B" stroke-width="1.5"/>
  <text x="300" y="304" fill="#174D3B" font-family="'Noto Naskh Arabic', serif" font-size="15" font-weight="bold" text-anchor="middle">«أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...»</text>

  <!-- Virtue badge: فُتحت له أبواب الجنة الثمانية -->
  <rect x="175" y="55" width="250" height="30" rx="15" fill="#26745A"/>
  <text x="300" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">تُفْتَحُ لَهُ أَبْوَابُ الْجَنَّةِ الثَّمَانِيَةُ</text>

  <!-- Step Banner Badge -->
  <g transform="translate(195, 360)">
    <rect width="210" height="38" rx="19" fill="#174D3B"/>
    <text x="105" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ١٠: الدعاء بعد الوضوء</text>
  </g>
</svg>
