<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <!-- Background Card -->
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <!-- Subtle Islamic Geometric Accent Pattern in Corner -->
  <path d="M480 40 L520 80 M500 40 L540 80 M480 60 L540 60" stroke="#E9D9B7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Decorative Circle Backdrop -->
  <circle cx="300" cy="210" r="130" fill="#E7F0E9" opacity="0.7"/>
  <circle cx="300" cy="210" r="105" fill="#FFFFFF" stroke="#B99A5B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Central Visual: Pure Water Jug & Heart of Sincerity (النية والتسمية) -->
  <!-- Water Ewer / Pitcher -->
  <path d="M260 270 C250 250 245 220 255 190 C265 160 285 145 300 145 C315 145 335 160 345 190 C355 220 350 250 340 270 Z" fill="#26745A" opacity="0.15"/>
  <path d="M265 265 C255 245 250 215 260 185 C270 155 285 145 300 145 C315 145 330 155 340 185 C350 215 345 245 335 265 Z" stroke="#174D3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Handle -->
  <path d="M255 185 C225 190 220 240 260 250" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Spout -->
  <path d="M340 190 C365 185 375 160 380 150" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Base -->
  <ellipse cx="300" cy="265" rx="35" ry="8" fill="#174D3B"/>

  <!-- Water Drops of Purity -->
  <path d="M390 170 C390 170 380 185 380 195 C380 200 384 205 390 205 C396 205 400 200 400 195 C400 185 390 170 390 170 Z" fill="#26745A"/>
  <path d="M398 215 C398 215 392 225 392 232 C392 236 395 239 398 239 C401 239 404 236 404 232 C404 225 398 215 398 215 Z" fill="#26745A" opacity="0.8"/>

  <!-- Heart/Intention Symbol (النية محلها القلب) -->
  <circle cx="300" cy="205" r="28" fill="#FAF9F5" stroke="#B99A5B" stroke-width="2.5"/>
  <path d="M300 217 C300 217 286 208 286 199 C286 193 290 189 295 189 C298 189 300 192 300 192 C300 192 302 189 305 189 C310 189 314 193 314 199 C314 208 300 217 300 217 Z" fill="#B99A5B"/>

  <!-- Step Banner Badge -->
  <g transform="translate(230, 350)">
    <rect width="140" height="38" rx="19" fill="#174D3B"/>
    <text x="70" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الخطوة ١: النية والتسمية</text>
  </g>
</svg>
