<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Rising Motion Diagram: Upward arrows indicating rising to standing -->
  <path d="M250 280 Q260 190 300 135" stroke="#26745A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4"/>
  <polygon points="300,135 292,143 302,146" fill="#26745A"/>

  <!-- Semi-rising figure transferring weight smoothly -->
  <circle cx="300" cy="120" r="24" fill="#F1EEE6" stroke="#174D3B" stroke-width="4"/>
  <path d="M280 155 L260 250 L340 250 L320 155 Z" stroke="#174D3B" stroke-width="4.5" fill="#F1EEE6"/>
  <path d="M260 250 L275 320" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M340 250 L325 320" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Takbir of movement: الله أكبر -->
  <rect x="220" y="45" width="160" height="34" rx="17" fill="#174D3B"/>
  <text x="300" y="68" fill="#FFFFFF" font-family="'Noto Naskh Arabic', serif" font-size="15" font-weight="bold" text-anchor="middle">«اللَّهُ أَكْبَرُ»</text>

  <!-- Step Banner Badge -->
  <g transform="translate(180, 365)">
    <rect width="240" height="38" rx="19" fill="#174D3B"/>
    <text x="120" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الموضع ٨: القيام للركعة التالية</text>
  </g>
</svg>
