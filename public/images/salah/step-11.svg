<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Sitting Figure with head turned to the right (حتى يُرى بياض خده الأيمن) -->
  <line x1="120" y1="295" x2="480" y2="295" stroke="#174D3B" stroke-width="3"/>

  <!-- Head turned to right profile -->
  <circle cx="315" cy="125" r="24" fill="#F1EEE6" stroke="#174D3B" stroke-width="4"/>
  <!-- Turning indicator arrow to right -->
  <path d="M280 100 Q330 85 360 115" stroke="#26745A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="360,115 352,108 359,105" fill="#26745A"/>
  
  <!-- Secondary arrow showing left turn after (ثم عن يساره) -->
  <path d="M270 115 Q240 100 230 115" stroke="#B99A5B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Torso & sitting posture -->
  <path d="M270 170 L255 270 C255 285 275 295 315 295 L365 295" stroke="#174D3B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M255 270 L335 270 L340 295" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M270 185 L320 250" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="325" cy="255" rx="14" ry="7" fill="#FFFFFF" stroke="#26745A" stroke-width="3"/>

  <!-- Taslim Callout Banner -->
  <rect x="140" y="45" width="320" height="34" rx="17" fill="#174D3B"/>
  <text x="300" y="68" fill="#FFFFFF" font-family="'Noto Naskh Arabic', serif" font-size="15" font-weight="bold" text-anchor="middle">«السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ»</text>

  <!-- Obligatory Marker Badge -->
  <rect x="70" y="60" width="85" height="32" rx="16" fill="#174D3B"/>
  <text x="112" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ركن من الأركان</text>

  <!-- Step Banner Badge -->
  <g transform="translate(195, 365)">
    <rect width="210" height="38" rx="19" fill="#174D3B"/>
    <text x="105" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الموضع ١١: التسليمتان والختام</text>
  </g>
</svg>
