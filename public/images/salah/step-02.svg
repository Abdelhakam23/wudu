<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Head bowed humbly looking down at Sujud spot -->
  <circle cx="300" cy="110" r="26" fill="#F1EEE6" stroke="#174D3B" stroke-width="4"/>

  <!-- Torso -->
  <path d="M265 170 L255 305 L345 305 L335 170 Z" fill="#F1EEE6" stroke="#174D3B" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Hands folded on the chest: Right hand over left wrist/forearm (وضع اليمنى على اليسرى على الصدر) -->
  <path d="M265 175 C265 195 280 205 300 205 C320 205 335 195 335 175" stroke="#174D3B" stroke-width="4.5" fill="none"/>
  <!-- Folded hands box highlight -->
  <rect x="275" y="195" width="50" height="24" rx="8" fill="#FFFFFF" stroke="#26745A" stroke-width="3"/>
  <path d="M290 195 L290 219 M305 195 L305 219" stroke="#26745A" stroke-width="2"/>
  
  <text x="360" y="212" fill="#B99A5B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">اليمنى على اليسرى</text>
  <path d="M350 210 L330 207" stroke="#B99A5B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Feet parallel -->
  <path d="M275 305 L275 335 L260 335" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M325 305 L325 335 L340 335" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Recitation Banner: Surah Al-Fatihah -->
  <rect x="150" y="45" width="300" height="34" rx="17" fill="#26745A"/>
  <text x="300" y="68" fill="#FFFFFF" font-family="'Noto Naskh Arabic', serif" font-size="15" font-weight="bold" text-anchor="middle">«بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ • الْحَمْدُ لِلَّهِ...»</text>

  <!-- Obligatory Marker Badge -->
  <rect x="70" y="60" width="85" height="32" rx="16" fill="#174D3B"/>
  <text x="112" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ركن من الأركان</text>

  <!-- Step Banner Badge -->
  <g transform="translate(180, 365)">
    <rect width="240" height="38" rx="19" fill="#174D3B"/>
    <text x="120" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الموضع ٢: قراءة الفاتحة وسورة</text>
  </g>
</svg>
