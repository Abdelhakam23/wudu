<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" rx="24" fill="#FAF9F5"/>
  <rect x="20" y="20" width="560" height="410" rx="18" fill="#FFFFFF" stroke="#E7F0E9" stroke-width="2"/>
  
  <circle cx="300" cy="205" r="130" fill="#E7F0E9" opacity="0.7"/>

  <!-- Sitting Figure in Iftirash -->
  <line x1="120" y1="295" x2="480" y2="295" stroke="#174D3B" stroke-width="3"/>

  <!-- Head -->
  <circle cx="280" cy="130" r="24" fill="#F1EEE6" stroke="#174D3B" stroke-width="4"/>
  <path d="M270 170 L260 270 C260 285 280 295 320 295 L370 295" stroke="#174D3B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M260 270 L340 270 L345 295" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Hand with Index Finger pointing forward (الإشارة بالسبابة في التشهد) -->
  <path d="M270 185 L320 240" stroke="#174D3B" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Pointed index finger detail -->
  <ellipse cx="330" cy="245" rx="12" ry="8" fill="#FFFFFF" stroke="#26745A" stroke-width="3"/>
  <path d="M338 243 L360 238" stroke="#26745A" stroke-width="4" stroke-linecap="round"/>
  <text x="390" y="235" fill="#26745A" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">الإشارة بالسبابة</text>

  <!-- Left hand resting flat on left knee -->
  <path d="M290 200 L330 260" stroke="#174D3B" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Tashahhud Callout Banner -->
  <rect x="110" y="45" width="380" height="34" rx="17" fill="#174D3B"/>
  <text x="300" y="68" fill="#FFFFFF" font-family="'Noto Naskh Arabic', serif" font-size="14" font-weight="bold" text-anchor="middle">«التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ...»</text>

  <!-- Classification Badge: واجب من واجبات الصلاة -->
  <rect x="70" y="60" width="85" height="32" rx="16" fill="#26745A"/>
  <text x="112" y="81" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">واجب</text>

  <!-- Step Banner Badge -->
  <g transform="translate(205, 365)">
    <rect width="190" height="38" rx="19" fill="#174D3B"/>
    <text x="95" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">الموضع ٩: التشهد الأول</text>
  </g>
</svg>
